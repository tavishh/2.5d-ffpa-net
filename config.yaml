# FFPA-Net 2.5D Configuration
# Variant: csa_decoder_only (primary ablation target)
#
# To run the 2D baseline instead, set:
#   data.three_slice: false
#   ffpa.variant: baseline_2d

experiment:
  name: "FFPA-CSA-Decoder-Only"
  description: "2.5D FFPA-Net with Cross-Slice Attention in decoder only"

data:
  root_dir: "data/muscle_top10"
  image_size: 256
  batch_size: 8
  num_workers: 4
  three_slice: true        # false for 2D baseline

model:
  num_classes: 11          # 10 foreground + 1 background; computed automatically by dataset.py
  in_channels: 1
  selected_classes: [21, 34, 76, 90, 96, 200, 214, 241, 248, 255]
  remap_classes: true      # remaps sparse IDs -> contiguous 1..10; background stays 0

ffpa:
  base_channels: 40
  use_original_image: true
  use_deep_supervision: true
  variant: csa_decoder_only  # options: baseline_2d | fusion_only | csa_input_only | csa_decoder_only | csa_full

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  device: "cuda"
  val_interval: 1
  save_interval: 10
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001

loss:
  type: "dice_ce"
  weight_dice: 0.5
  weight_ce: 0.5

evaluation:
  save_predictions: true
  metrics: [dice, dice_fg, iou, hd95]

output:
  dir: "outputs"

seed: 42

debug:
  enabled: false
  subset_ratio: 0.1